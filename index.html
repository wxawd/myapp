<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品列表 - HA Web Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #333;
    }
    .header {
      background: #1f3a5f;
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 22px; }
    .server-info { font-size: 13px; opacity: .8; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .card .name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .card .desc { font-size: 13px; color: #777; min-height: 36px; margin-bottom: 12px; }
    .card .price { font-size: 18px; color: #c0392b; font-weight: 700; }
    .card .stock { font-size: 12px; color: #999; margin-top: 6px; }
    .stock.out { color: #c0392b; }
    .footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      padding: 30px 0;
    }
    .loading { text-align: center; padding: 60px 0; color: #999; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛒 商品中心</h1>
    <div class="server-info" id="serverInfo">加载中…</div>
  </div>

  <div class="container">
    <div class="loading" id="loading">正在加载商品…</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="footer">高可用多节点 Web 服务系统 · Demo</div>

  <script>
    // 渲染商品卡片
    function render(products) {
      const grid = document.getElementById('grid');
      const loading = document.getElementById('loading');
      loading.style.display = 'none';
      grid.innerHTML = products.map(p => `
        <div class="card">
          <div class="name">${p.name}</div>
          <div class="desc">${p.description}</div>
          <div class="price">¥${p.price.toFixed(2)}</div>
          <div class="stock ${p.stock === 0 ? 'out' : ''}">
            ${p.stock > 0 ? '库存：' + p.stock + ' 件' : '已售罄'}
          </div>
        </div>
      `).join('');
    }

    // 拉取商品列表；失败时展示兜底数据，避免白屏
    fetch('/api/products')
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        document.getElementById('serverInfo').textContent =
          '后端节点：' + data.hostname + ' · 渲染时间 ' + data.time;
        render(data.products);
      })
      .catch(err => {
        document.getElementById('serverInfo').textContent = '后端连接失败，展示兜底数据';
        document.getElementById('loading').style.display = 'none';
        render([
          { name: '示例商品 A', description: '后端未连接时的占位数据', price: 99.0, stock: 10 },
          { name: '示例商品 B', description: '请检查 Flask 服务是否启动', price: 199.0, stock: 0 },
        ]);
      });
  </script>
</body>
</html>
